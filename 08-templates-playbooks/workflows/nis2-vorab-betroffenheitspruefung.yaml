id: nis2-vorab-betroffenheitspruefung
version: 1.0.0
purpose: Structure in advance whether NIS2 applicability indicators may be present; the final assessment remains strictly legal/human.
trigger:
  - Initial screening for NIS2 applicability
  - Preparation for legal handoff
  - Preparation for NIS2 readiness gap work
inputs:
  required:
    - legal_entity_or_scope
    - activities_goods_services
    - employee_count
    - revenue_and_balance_sheet_indicators
    - sector_or_service_hypothesis
  optional:
    - group_or_partner_company_context
    - critical_facility_indicators
    - energy_tk_finance_telematics_public_sector_context
    - digital_service_or_infrastructure_context
agents:
  lead: nis2-scope-precheck-analyst
  support:
    - regulatory-source-mapper
    - compliance-register-curator
    - nis2-readiness-analyst
    - risk-and-obligation-prioritizer
    - agent-quality-and-safety-reviewer
templates:
  - templates/nis2-vorab-betroffenheitspruefung-fragebogen.md
  - templates/legal-datenschutz-handoff.md
source_anchors:
  - 01-orientation/knowledge-sources/nis2-primary-sources.md
  - 01-orientation/knowledge-sources/hardwired-sources.yaml
steps:
  - id: mandatory_disclaimer
    agent: nis2-scope-precheck-analyst
    action: Issue mandatory notice that no legal advice and no binding applicability determination is provided.
    output: disclaimer_note
    human_gate: A lawyer or Legal must review the result.
  - id: source_anchor_mapping
    agent: regulatory-source-mapper
    action: Capture NIS2, BSIG, BSIG § 28, Annexes 1/2, EnWG § 5c-5e, and Implementing Regulation 2024/2690 as source anchors.
    output: source_map
  - id: bsig_precheck
    agent: nis2-scope-precheck-analyst
    action: Structurally pre-check size, activity, special category, and exclusion logic under BSIG § 28 and Annexes 1/2.
    output: bsig_precheck_matrix
    human_gate: Have the type of entity and size/group logic legally reviewed.
  - id: sector_specific_paths
    agent: nis2-scope-precheck-analyst
    action: Mark energy, telecommunications, finance/DORA, telematics, public administration, and digital services/infrastructure as special paths.
    output: special_regime_note
  - id: implementing_regulation_check
    agent: nis2-scope-precheck-analyst
    action: For DNS, TLD, cloud, data center, CDN, MSP, MSSP, online marketplace, search engine, social network, or trust services, activate Implementing Regulation (EU) 2024/2690 as an evaluation path.
    output: eu_2024_2690_relevance_note
  - id: bsi_faq_plausibility
    agent: nis2-scope-precheck-analyst
    action: Use the BSI applicability assessment and sector-specific FAQ for plausibility checking only after the structured preliminary check.
    output: bsi_faq_plausibility_note
  - id: legal_handoff
    agent: nis2-scope-precheck-analyst
    action: Hand over open legal questions, sources, assumptions, and preliminary result to a lawyer/Legal.
    output: legal_handoff
    human_gate: Final applicability and obligations are reviewed by humans/legal.
  - id: readiness_handoff
    agent: nis2-readiness-analyst
    action: If possible applicability or uncertainty exists, prepare gap assessment and evidence plan.
    output: nis2_readiness_start_note
outputs:
  - preliminary_scope_questionnaire
  - source_anchor_map
  - bsi_faq_plausibility_note
  - legal_review_handoff
  - readiness_handoff
stop_points:
  - a final legal applicability decision is requested
  - real confidential organizational data is to be included in public artifacts
  - external communication or authority notification is to occur without approval
  - compliance assurance or non-applicability assurance is expected
quality_gates:
  - U1 Public-Safe Gate
  - U2 Claim-Safety Gate
  - U3 Operating Logic Gate
  - U6 Portability Gate
  - A5 Workflow Gate
